<div class="flex flex-col items-center justify-center min-h-screen bg-gray-100">
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm">
    <h2 class="text-2xl font-bold mb-6 text-center">เข้าสู่ระบบด้วยบัญชี</h2>

   <div [formGroup]="loginForm">
      <mat-form-field class="w-full">
        <mat-label>Username</mat-label>
        <input formControlName="username" matInput placeholder="Username" />
      </mat-form-field>

      <mat-form-field class="w-full">
        <mat-label>Password</mat-label>
        <input formControlName="password" matInput type="password" placeholder="Password" />
      </mat-form-field>
   </div>

    <button
      (click)="login()"
      class="flex items-center justify-center w-full py-2 px-4 border border-gray-300 rounded-md shadow-sm bg-white hover:bg-gray-50"
    >
      Sign in
    </button>
